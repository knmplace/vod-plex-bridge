<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOD Plex Bridge — Sign in</title>
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
    :root {
        --bg-primary: #0a0e17;
        --bg-card: #1a2236;
        --border: #2a3654;
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 16px;
        background: radial-gradient(ellipse at top, #13203b 0%, var(--bg-primary) 60%);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .card {
        width: 100%; max-width: 380px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 2rem 1.75rem;
        box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
    .brand img { width: 44px; height: 44px; border-radius: 10px; }
    .brand h1 { font-size: 1.15rem; font-weight: 700; }
    .brand h1 span { color: var(--accent); }
    .intro { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); margin: 0.9rem 0 0.35rem; }
    input {
        width: 100%; padding: 0.65rem 0.8rem;
        border-radius: 8px; border: 1px solid var(--border);
        background: var(--bg-primary); color: var(--text-primary);
        font-size: 0.95rem;
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.25); }
    button {
        width: 100%; margin-top: 1.4rem; padding: 0.75rem;
        border: none; border-radius: 8px;
        background: var(--accent); color: #fff;
        font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error { min-height: 1.2rem; margin-top: 0.9rem; font-size: 0.82rem; color: var(--danger); }
</style>
</head>
<body>
<form class="card" id="form" autocomplete="on">
    <div class="brand">
        <img src="/static/logo.png" alt="">
        <h1><span>VOD</span> Plex Bridge</h1>
    </div>
    <p class="intro" id="intro">Sign in to continue.</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div id="confirmWrap" hidden>
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password">
    </div>
    <button id="submit" type="submit">Sign in</button>
    <div class="error" id="error"></div>
</form>
<script>
    let setup = false;
    const $ = id => document.getElementById(id);

    fetch('/api/auth/status', {cache: 'no-store'}).then(r => r.json()).then(s => {
        if (s.username) return location.replace('/');
        setup = s.setup_required;
        if (setup) {
            $('intro').textContent = 'Welcome. Create the account that will protect this bridge — you will use it to sign in from now on.';
            $('confirmWrap').hidden = false;
            $('confirm').required = true;
            $('password').autocomplete = 'new-password';
            $('submit').textContent = 'Create account';
        }
    });

    $('form').addEventListener('submit', async e => {
        e.preventDefault();
        $('error').textContent = '';
        if (setup && $('password').value !== $('confirm').value) {
            $('error').textContent = 'Passwords do not match';
            return;
        }
        $('submit').disabled = true;
        try {
            const r = await fetch(setup ? '/api/auth/setup' : '/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: $('username').value, password: $('password').value}),
            });
            const body = await r.json().catch(() => ({}));
            if (r.ok) return location.replace('/');
            $('error').textContent = body.error || `Sign in failed (HTTP ${r.status})`;
        } catch (err) {
            $('error').textContent = 'Could not reach the bridge';
        }
        $('submit').disabled = false;
    });
</script>
</body>
</html>
