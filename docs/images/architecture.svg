<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1040" height="560" fill="#ffffff"/>

  <!-- IPTV provider -->
  <rect x="30" y="30" width="240" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="58" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">IPTV provider</text>
  <text x="150" y="80" text-anchor="middle" font-size="13" fill="#4b5563">on the internet</text>

  <!-- Dispatcharr host -->
  <rect x="30" y="150" width="240" height="270" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Dispatcharr host</text>
  <rect x="50" y="195" width="200" height="80" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="150" y="226" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Dispatcharr</text>
  <text x="150" y="248" text-anchor="middle" font-size="13" fill="#4b5563">container, port 9191</text>
  <rect x="50" y="300" width="200" height="100" rx="8" fill="#ffffff" stroke="#2563eb" stroke-dasharray="5 3"/>
  <text x="150" y="330" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Bridge agent</text>
  <text x="150" y="352" text-anchor="middle" font-size="13" fill="#4b5563">installed by Command A</text>
  <text x="150" y="372" text-anchor="middle" font-size="13" fill="#4b5563">checks in every minute</text>

  <!-- Bridge host -->
  <rect x="400" y="150" width="240" height="270" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Bridge host</text>
  <rect x="420" y="195" width="200" height="100" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="520" y="226" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">VOD Plex Bridge</text>
  <text x="520" y="248" text-anchor="middle" font-size="13" fill="#4b5563">container, port 8585</text>
  <text x="520" y="268" text-anchor="middle" font-size="13" fill="#4b5563">web UI, catalog, streams</text>
  <rect x="420" y="320" width="200" height="80" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="520" y="352" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">/data</text>
  <text x="520" y="374" text-anchor="middle" font-size="13" fill="#4b5563">database and lists</text>

  <!-- Media host -->
  <rect x="770" y="150" width="240" height="270" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="890" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#581c87">Plex / Jellyfin host</text>
  <rect x="790" y="195" width="200" height="100" rx="8" fill="#ffffff" stroke="#9333ea" stroke-dasharray="5 3"/>
  <text x="890" y="226" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">rclone mounts</text>
  <text x="890" y="248" text-anchor="middle" font-size="13" fill="#4b5563">installed by Command B</text>
  <text x="890" y="268" text-anchor="middle" font-size="13" fill="#4b5563">/mnt/vod-bridge, -series</text>
  <rect x="790" y="320" width="200" height="80" rx="8" fill="#ffffff" stroke="#9333ea"/>
  <text x="890" y="352" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Plex :32400</text>
  <text x="890" y="374" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Jellyfin :8096</text>

  <!-- Dispatcharr <-> provider -->
  <line x1="150" y1="195" x2="150" y2="98" stroke="#374151" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="162" y="128" font-size="12" fill="#374151">the only connection</text>
  <text x="162" y="143" font-size="12" fill="#374151">to the provider</text>

  <!-- Bridge -> Dispatcharr -->
  <line x1="420" y1="245" x2="254" y2="245" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="222" text-anchor="middle" font-size="12" fill="#374151">API and VOD proxy</text>
  <text x="335" y="237" text-anchor="middle" font-size="12" fill="#374151">port 9191</text>

  <!-- Agent -> Bridge -->
  <line x1="250" y1="360" x2="416" y2="360" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="337" text-anchor="middle" font-size="12" fill="#374151">movie and series lists</text>
  <text x="335" y="352" text-anchor="middle" font-size="12" fill="#374151">port 8585</text>

  <!-- rclone -> Bridge -->
  <line x1="790" y1="245" x2="624" y2="245" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="705" y="222" text-anchor="middle" font-size="12" fill="#374151">reads /vod/ and</text>
  <text x="705" y="237" text-anchor="middle" font-size="12" fill="#374151">/vod-series/, port 8585</text>

  <!-- Plex reads the mount -->
  <line x1="890" y1="320" x2="890" y2="299" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="313" font-size="11" fill="#374151">reads folders</text>

  <!-- Browser -->
  <rect x="400" y="470" width="240" height="60" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
  <text x="520" y="496" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Your browser</text>
  <text x="520" y="516" text-anchor="middle" font-size="13" fill="#4b5563">http://BRIDGE_IP:8585</text>
  <line x1="520" y1="470" x2="520" y2="424" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="770" y="462" width="18" height="12" rx="2" fill="#ffffff" stroke="#374151" stroke-dasharray="5 3"/>
  <text x="796" y="473" font-size="12" fill="#374151">set up for you by a pasted command</text>
  <text x="770" y="500" font-size="12" fill="#374151">The three hosts can be one machine,</text>
  <text x="770" y="516" font-size="12" fill="#374151">two, or three. No shared storage needed.</text>
</svg>
